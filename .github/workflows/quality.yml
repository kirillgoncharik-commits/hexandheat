name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate repository policy
        run: python tools/validate_repo.py
      - name: Run governance tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  implementation-gate:
    # Manual-only until the Product Owner approves G1 and the repository adds
    # ARCHITECTURE_APPROVED plus pinned implementation manifests.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require implementation manifests
        shell: bash
        run: |
          test -f package.json
          test -f pnpm-lock.yaml
          test -f math/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Frontend quality and static build
        run: pnpm install --frozen-lockfile && pnpm run lint && pnpm run test && pnpm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Math tests
        run: python -m pip install -r math/requirements.lock && python -m pytest math tests/math
